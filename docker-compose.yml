services:
  chroma:
    image: chromadb/chroma:latest
    command: ["run", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - ./chroma:/chroma/chroma
    ports:
      - "8000:8000"

  vllm:
    image: vllm/vllm-openai:latest
    command:
      - intfloat/multilingual-e5-small
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --gpu-memory-utilization
      - "0.35"
      - --max-model-len
      - "512"
      - --max-num-seqs
      - "1"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /root/.cache/huggingface
    volumes:
      - hf-cache:/root/.cache/huggingface
    ports:
      - "8080:8080"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uvicorn", "src.api.app:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      CHROMA_MODE: http
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      EMBEDDING_BASE_URL: http://vllm:8080/v1
      RERANKER_DEVICE: cuda
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs
      - ./chroma:/app/chroma
    ports:
      - "8001:8001"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      - chroma
      - vllm

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "UI/app.py"]
    environment:
      API_BASE_URL: http://api:8001
    ports:
      - "7860:7860"
    depends_on:
      - api

volumes:
  hf-cache:
